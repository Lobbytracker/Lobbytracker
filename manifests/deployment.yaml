apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobbytracker-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobbytracker
  template:
    metadata:
      labels:
        app: lobbytracker
    spec:
      containers:
        - name: lobbytracker
          image: PLACEHOLDER
          ports:
            - containerPort: 8000
          
