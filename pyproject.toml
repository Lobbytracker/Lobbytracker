[project]
name = "lobbytracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "openai>=3.8.0",
    "pandas>=2.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.0.0",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pylint.messages_control]
disable = ["missing-module-docstring"]
